name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.19"
          python-version: "3.13"
          enable-cache: false

      - name: Sync locked development environment
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type-check
        run: uv run --frozen pyright

      - name: Test
        run: uv run --frozen pytest

      - name: Build distributions
        run: uv build

      - name: Smoke-test package metadata and CLI
        run: |
          uv run --frozen python -c "import faultatlas; from importlib.metadata import version; assert faultatlas.__version__ == version('faultatlas')"
          uv run --frozen faultatlas --help
          uv run --frozen faultatlas --version
          uv run --frozen python -c "from importlib.metadata import version; import subprocess; result = subprocess.run(['faultatlas', '--version'], check=True, capture_output=True, text=True); assert result.stdout == version('faultatlas') + '\n', repr(result.stdout)"
          uv run --frozen python -m faultatlas
          uv run --frozen python -m faultatlas --help
