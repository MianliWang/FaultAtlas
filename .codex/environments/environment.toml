# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "FaultAtlas"

[setup]
script = ""

[setup.linux]
script = '''
set -eu

cd "$CODEX_WORKTREE_PATH"

unset \
  VIRTUAL_ENV \
  PYTHONHOME \
  CONDA_DEFAULT_ENV \
  CONDA_PREFIX \
  CONDA_PROMPT_MODIFIER \
  2>/dev/null || true

export UV_CACHE_DIR="${TMPDIR:-/tmp}/faultatlas-uv-cache"
export UV_MANAGED_PYTHON=1
mkdir -p "$UV_CACHE_DIR"

command -v uv >/dev/null 2>&1
uv --version

uv sync --locked --group dev

uv run --frozen python - <<'PY'
import sys
from pathlib import Path

expected = (Path.cwd() / ".venv").resolve()
actual = Path(sys.prefix).resolve()

assert sys.version_info[:2] == (3, 13), sys.version
assert actual == expected, (actual, expected)

print(f"FaultAtlas environment ready: {sys.executable}")
PY'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"
$PSNativeCommandUseErrorActionPreference = $true

if ([string]::IsNullOrWhiteSpace($env:CODEX_WORKTREE_PATH)) {
    throw "CODEX_WORKTREE_PATH is required for FaultAtlas setup."
}

Set-Location -LiteralPath $env:CODEX_WORKTREE_PATH

$externalPythonVariables = @(
    "VIRTUAL_ENV",
    "PYTHONHOME",
    "PYTHONPATH",
    "PYTHONSTARTUP",
    "PYTHONUSERBASE",
    "CONDA_DEFAULT_ENV",
    "CONDA_PREFIX",
    "CONDA_PROMPT_MODIFIER",
    "CONDA_PYTHON_EXE",
    "CONDA_SHLVL"
)

foreach ($variable in $externalPythonVariables) {
    Remove-Item -LiteralPath "Env:$variable" -ErrorAction SilentlyContinue
}

$env:UV_MANAGED_PYTHON = "1"
$env:UV_CACHE_DIR = Join-Path -Path ([System.IO.Path]::GetTempPath()) -ChildPath "faultatlas-uv-cache"
[System.IO.Directory]::CreateDirectory($env:UV_CACHE_DIR) | Out-Null

if ($null -eq (Get-Command uv -CommandType Application -ErrorAction SilentlyContinue)) {
    throw "uv is required for FaultAtlas setup but was not found on PATH."
}

uv --version
uv lock --check
uv sync --locked --group dev

$uvPythonDir = (& uv python dir).Trim()
if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($uvPythonDir)) {
    throw "uv python dir did not return the managed Python directory."
}

$verificationScript = @'
import os
import sys
from pathlib import Path

worktree = Path.cwd().resolve()
expected_prefix = (worktree / ".venv").resolve()
actual_prefix = Path(sys.prefix).resolve()
base_executable = Path(sys._base_executable).resolve()
uv_python_dir = Path(sys.argv[1]).resolve()

assert sys.version_info[:2] == (3, 13), sys.version
assert actual_prefix == expected_prefix, (actual_prefix, expected_prefix)

try:
    base_executable.relative_to(uv_python_dir)
except ValueError as error:
    raise AssertionError(
        f"base interpreter is outside uv python dir: {base_executable}"
    ) from error

base_text = str(base_executable).casefold().replace("/", "\\")
for marker in ("\\anaconda", "\\miniconda", "\\mambaforge", "\\micromamba", "\\conda"):
    assert marker not in base_text, f"Conda interpreter is forbidden: {base_executable}"

assert not base_text.startswith("\\\\wsl$\\"), f"WSL interpreter is forbidden: {base_executable}"
assert not base_text.startswith("\\\\wsl.localhost\\"), f"WSL interpreter is forbidden: {base_executable}"
assert "\\mnt\\" not in base_text, f"WSL interpreter is forbidden: {base_executable}"
assert ".venv" not in {part.casefold() for part in base_executable.parts}, (
    f"checkout virtual environment is forbidden as a base interpreter: {base_executable}"
)

system_roots = [
    os.environ.get("SystemRoot"),
    os.environ.get("ProgramFiles"),
    os.environ.get("ProgramFiles(x86)"),
]
for value in filter(None, system_roots):
    system_root = Path(value).resolve()
    try:
        base_executable.relative_to(system_root)
    except ValueError:
        continue
    raise AssertionError(f"system interpreter is forbidden: {base_executable}")

for candidate in (uv_python_dir, *uv_python_dir.parents):
    if (candidate / ".git").exists():
        raise AssertionError(
            f"uv python dir is inside another Git checkout: {uv_python_dir}"
        )

print(f"python_version={sys.version.split()[0]}")
print(f"sys_executable={Path(sys.executable).resolve()}")
print(f"sys_prefix={actual_prefix}")
print(f"sys_base_executable={base_executable}")
print(f"uv_python_dir={uv_python_dir}")
'@

$verificationScript | uv run --frozen python - $uvPythonDir'''

[cleanup]
script = ""

[cleanup.linux]
script = "true"

[cleanup.win32]
script = "exit 0"

[[actions]]
name = "Validate"
icon = "tool"
command = '''
set -eu

root="$(git rev-parse --show-toplevel)"
cd "$root"
export UV_MANAGED_PYTHON=1

unset VIRTUAL_ENV PYTHONHOME CONDA_DEFAULT_ENV CONDA_PREFIX CONDA_PROMPT_MODIFIER \
  2>/dev/null || true

export UV_CACHE_DIR="${TMPDIR:-/tmp}/faultatlas-uv-cache"
mkdir -p "$UV_CACHE_DIR"

uv lock --check
uv sync --locked --group dev
uv run --frozen ruff format --check .
uv run --frozen ruff check .
uv run --frozen pyright
uv run --frozen pytest

uv run --frozen python - <<'PY'
from pathlib import Path
import shutil

root = Path.cwd().resolve()
dist = root / "dist"

if dist.is_symlink():
    raise SystemExit(f"refusing to remove symlinked build directory: {dist}")

if dist.exists():
    if not dist.is_dir():
        raise SystemExit(f"expected dist to be a directory: {dist}")
    shutil.rmtree(dist)
PY

uv build'''
platform = "linux"

