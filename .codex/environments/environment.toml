icon = "tool"
command = '''
$ErrorActionPreference = "Stop"
$PSNativeCommandUseErrorActionPreference = $true

$root = (& git rev-parse --show-toplevel).Trim()
if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($root)) {
    throw "Unable to determine the FaultAtlas Git root."
}
Set-Location -LiteralPath $root

$externalPythonVariables = @(
    "VIRTUAL_ENV",
    "PYTHONHOME",
    "PYTHONPATH",
    "PYTHONSTARTUP",
    "PYTHONUSERBASE",
    "CONDA_DEFAULT_ENV",
    "CONDA_PREFIX",
    "CONDA_PROMPT_MODIFIER",
    "CONDA_PYTHON_EXE",
    "CONDA_SHLVL"
)

foreach ($variable in $externalPythonVariables) {
    Remove-Item -LiteralPath "Env:$variable" -ErrorAction SilentlyContinue
}

$env:UV_MANAGED_PYTHON = "1"
$env:UV_CACHE_DIR = Join-Path -Path ([System.IO.Path]::GetTempPath()) -ChildPath "faultatlas-uv-cache"
[System.IO.Directory]::CreateDirectory($env:UV_CACHE_DIR) | Out-Null

uv lock --check
uv sync --locked --group dev
uv run --frozen ruff format --check .
uv run --frozen ruff check .
uv run --frozen pyright
uv run --frozen pytest

$dist = Join-Path -Path $root -ChildPath "dist"
$distItem = Get-Item -LiteralPath $dist -Force -ErrorAction SilentlyContinue
if ($null -ne $distItem) {
    if (($distItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
        throw "Refusing to remove reparse point at dist: $dist"
    }
    if (-not $distItem.PSIsContainer) {
        throw "Refusing to remove non-directory at dist: $dist"
    }
    Remove-Item -LiteralPath $dist -Recurse -Force
}

uv build'''
