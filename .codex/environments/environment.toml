# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "FaultAtlas WSL"

[setup]
script = ""

[setup.linux]
script = '''
set -eu

cd "$CODEX_WORKTREE_PATH"

unset \
  VIRTUAL_ENV \
  PYTHONHOME \
  CONDA_DEFAULT_ENV \
  CONDA_PREFIX \
  CONDA_PROMPT_MODIFIER \
  2>/dev/null || true

export UV_CACHE_DIR="${TMPDIR:-/tmp}/faultatlas-uv-cache"
mkdir -p "$UV_CACHE_DIR"

command -v uv >/dev/null 2>&1
uv --version

uv sync --locked --group dev

uv run --frozen python - <<'PY'
import sys
from pathlib import Path

expected = (Path.cwd() / ".venv").resolve()
actual = Path(sys.prefix).resolve()

assert sys.version_info[:2] == (3, 13), sys.version
assert actual == expected, (actual, expected)

print(f"FaultAtlas environment ready: {sys.executable}")
PY'''

[setup.win32]
script = '''
Write-Error "FaultAtlas requires the Codex WSL agent. Switch the Agent environment and integrated terminal to WSL."
exit 1'''

[cleanup]
script = ""

[cleanup.linux]
script = "true"

[cleanup.win32]
script = "exit 0"

[[actions]]
name = "Validate"
icon = "tool"
command = '''
set -eu

root="$(git rev-parse --show-toplevel)"
cd "$root"

unset VIRTUAL_ENV PYTHONHOME CONDA_DEFAULT_ENV CONDA_PREFIX CONDA_PROMPT_MODIFIER \
  2>/dev/null || true

export UV_CACHE_DIR="${TMPDIR:-/tmp}/faultatlas-uv-cache"
mkdir -p "$UV_CACHE_DIR"

uv lock --check
uv sync --locked --group dev
uv run --frozen ruff format --check .
uv run --frozen ruff check .
uv run --frozen pyright
uv run --frozen pytest

uv run --frozen python - <<'PY'
from pathlib import Path
import shutil

root = Path.cwd().resolve()
dist = root / "dist"

if dist.is_symlink():
    raise SystemExit(f"refusing to remove symlinked build directory: {dist}")

if dist.exists():
    if not dist.is_dir():
        raise SystemExit(f"expected dist to be a directory: {dist}")
    shutil.rmtree(dist)
PY

uv build'''
platform = "linux"

